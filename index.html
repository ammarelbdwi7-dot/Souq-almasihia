<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<title>سوق الماشية - عمار احمد البدوي</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Tahoma}
body{margin:0;background:#f5f7f5;padding-bottom:100px}
.header{background:#16a34a;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center}
.free-banner{background:#fef08a;color:#854d0e;padding:10px;text-align:center;font-weight:bold}
.free-banner span{background:#16a34a;color:#fff;padding:3px 10px;border-radius:20px}
.contacts{background:#fff;padding:12px;margin:12px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.contact-item{margin:6px 0}
.contact-item a{color:#16a34a;text-decoration:none;font-weight:bold;direction:ltr;display:inline-block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);position:relative}
.card img{width:100%;height:140px;object-fit:cover}
.badge{position:absolute;top:8px;right:8px;background:#16a34a;color:#fff;padding:3px 8px;border-radius:8px;font-size:12px}
.card-body{padding:10px}
.price{color:#16a34a;font-weight:bold;margin:4px 0}
.btn{width:100%;background:#16a34a;color:#fff;border:none;padding:9px;border-radius:9px;font-weight:bold;cursor:pointer}
.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:14px 22px;border-radius:30px;font-weight:bold;box-shadow:0 4px 15px rgba(0,0,0,.3);z-index:30;border:none;cursor:pointer;font-size:16px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;padding:12px}
.modal.show{display:flex}
.modal-box{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:16px}
.modal-box input, .modal-box select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.footer{background:#111;color:#fff;text-align:center;padding:16px;margin-top:20px;font-size:13px}
</style>
</head>
<body>
<div class="header"><h1>🐄 سوق الماشية</h1><div>عمار البدوي</div></div>
<div class="free-banner">🎉 النشر مجاني <span>مجانا</span> لكل التجار</div>
<div class="contacts">
<h3>📞 تواصل مع صاحب السوق</h3>
<div class="contact-item">📱 <a href="tel:+249112424044">+249 11 242 4044</a> الرئيسي</div>
<div class="contact-item">💬 <a href="https://wa.me/249112424044">واتساب</a> - <a href="tel:+249916572563">916572563</a> - <a href="tel:+249924172701">924172701</a></div>
<div class="contact-item">👤 عمار احمد البدوي</div>
</div>

<div class="grid" id="products"></div>

<button class="fab" onclick="openModal()">+ أضف بهيمتك مجانا</button>

<div class="modal" id="modal">
<div class="modal-box">
<h3 style="margin:0 0 10px;color:#16a34a">أضف بهيمتك - مجانا</h3>
<input id="pName" placeholder="مثال: خروف بلدي - 2 سنة">
<input id="pPrice" placeholder="السعر - مثال: 8500">
<input id="pPhone" placeholder="رقم واتساب - مثال: 0912345678">
<select id="pType"><option>بقرة</option><option>خروف</option><option>ماعز</option><option>إبل</option><option>أخرى</option></select>
<input type="file" id="pImage" accept="image/*">
<button class="btn" onclick="addProduct()">نشر الآن مجانا</button>
<button class="btn" style="background:#ddd;color:#111;margin-top:6px" onclick="closeModal()">إلغاء</button>
</div>
</div>

<div class="footer">سوق الماشية © 2026 - عمار احمد البدوي<br>0112424044 - 0916572563 - 0924172701</div>

<script>
const defaultProducts=[
{type:'بقرة',name:'بقرة حلوب',price:'15,000',img:'https://images.unsplash.com/photo-1527153857715-3908f2bae5e8?w=500',phone:'249112424044'},
{type:'خروف',name:'خروف بلدي',price:'8,500',img:'https://images.unsplash.com/photo-1500595046743-cd271d694d30?w=500',phone:'249916572563'}
];
function loadProducts(){
let stored=JSON.parse(localStorage.getItem('souq')||'[]');
let all=[...defaultProducts,...stored];
let html='';
all.forEach(p=>{
html+=`<div class="card"><img src="${p.img}"><div class="badge">${p.type}</div><div class="card-body"><h3>${p.name}</h3><div class="price">${p.price} ج.س</div><button class="btn" onclick="window.open('https://wa.me/${p.phone}?text=السلام عليكم - مهتم بـ ${p.name}','_blank')">تواصل واتساب</button></div></div>`;
});
document.getElementById('products').innerHTML=html;
}
function openModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function addProduct(){
const name=document.getElementById('pName').value;
const price=document.getElementById('pPrice').value;
const phone=document.getElementById('pPhone').value;
const type=document.getElementById('pType').value;
const file=document.getElementById('pImage').files[0];
if(!name||!price||!phone){alert('املأ كل البيانات');return;}
if(file){
const r=new FileReader();
r.onload=e=>{
saveProduct({name,price,phone,type,img:e.target.result});
};
r.readAsDataURL(file);
}else{
saveProduct({name,price,phone,type,img:'https://images.unsplash.com/photo-1527153857715-3908f2bae5e8?w=500'});
}
}
function saveProduct(p){
let stored=JSON.parse(localStorage.getItem('souq')||'[]');
stored.unshift(p);
localStorage.setItem('souq',JSON.stringify(stored));
closeModal();
loadProducts();
alert('تم النشر مجانا! 🎉');
}
loadProducts();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
