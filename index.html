<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<title>سوق الماشية - سوق التجار المفتوح</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#f5f7f5;padding-bottom:80px}
.header{background:#16a34a;color:#fff;padding:12px 16px;position:sticky;top:0}
.free-banner{background:#fef08a;color:#854d0e;padding:8px;text-align:center;font-weight:bold}
.free-banner span{background:#facc15;padding:2px 8px;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;position:relative}
.card img{width:100%;height:120px;object-fit:cover}
.card-body{padding:8px}
</style>
</head>
<body>
<div class="header"><h1>🐄 سوق الماشية</h1></div>
<div class="free-banner">🎉 النشر مجاني <span>مجانا</span></div>
<div class="grid"><div class="card"><div class="card-body">مرحبا بكم في السوق</div></div></div>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
